<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<th:block th:replace="~{layout/default :: layout(~{::content})}">
    <div th:fragment="content">
        <!-- Alerts -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
            <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Recipe Header -->
        <div class="d-flex justify-content-between align-items-start mb-4">
            <div>
                <h2>
                    <span th:text="${recipe.code}"></span>
                    <span class="badge ms-2"
                          th:classappend="${recipe.status.name() == 'DRAFT'} ? 'bg-secondary' :
                                          (${recipe.status.name() == 'APPROVED'} ? 'bg-success' : 'bg-danger')"
                          th:text="${recipe.status}"></span>
                </h2>
                <p class="text-muted mb-0" th:text="${recipe.name}"></p>
            </div>
            <div class="btn-group" sec:authorize="hasRole('ADMIN')">
                <a th:href="@{/recipes/{id}/edit(id=${recipe.id})}"
                   th:if="${recipe.status.name() == 'DRAFT'}"
                   class="btn btn-outline-primary">
                    <i class="bi bi-pencil me-1"></i>Edit
                </a>
                <form th:action="@{/recipes/{id}/approve(id=${recipe.id})}" method="post" class="d-inline"
                      th:if="${recipe.status.name() == 'DRAFT'}">
                    <button type="submit" class="btn btn-success"
                            onclick="return confirm('Approve this recipe?')">
                        <i class="bi bi-check-circle me-1"></i>Approve
                    </button>
                </form>
            </div>
        </div>

        <!-- Recipe Info -->
        <div class="card mb-4">
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <p><strong>Version:</strong> v<span th:text="${recipe.version}"></span></p>
                        <p><strong>Created:</strong>
                            <span th:text="${#temporals.format(recipe.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
                        </p>
                    </div>
                    <div class="col-md-6">
                        <p><strong>Description:</strong></p>
                        <p class="text-muted" th:text="${recipe.description ?: 'No description'}"></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Steps Section -->
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0"><i class="bi bi-list-ol me-2"></i>Recipe Steps</h5>
            </div>
            <div class="card-body">
                <!-- Add Step Form (only for DRAFT) -->
                <div th:if="${recipe.status.name() == 'DRAFT'}" class="mb-4" sec:authorize="hasRole('ADMIN')">
                    <form th:action="@{/recipes/{id}/steps(id=${recipe.id})}" method="post" class="row g-2">
                        <div class="col-md-3">
                            <input type="text" class="form-control" name="name"
                                   placeholder="Step name" required>
                        </div>
                        <div class="col-md-4">
                            <input type="text" class="form-control" name="description"
                                   placeholder="Step description">
                        </div>
                        <div class="col-md-3">
                            <select class="form-select" name="qualificationIds" multiple>
                                <option value="" disabled>Required qualifications</option>
                                <option th:each="q : ${qualifications}"
                                        th:value="${q.id}"
                                        th:text="${q.name}"></option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-plus-lg me-1"></i>Add Step
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Steps List -->
                <div th:if="${#lists.isEmpty(recipe.steps)}" class="text-center text-muted py-4">
                    No steps defined. Add steps to this recipe.
                </div>

                <div class="accordion" id="stepsAccordion">
                    <div th:each="step : ${recipe.steps}" class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed" type="button"
                                    data-bs-toggle="collapse"
                                    th:data-bs-target="'#step-' + ${step.id}">
                                <span class="badge bg-primary me-2" th:text="${'Step ' + step.stepNumber}"></span>
                                <span th:text="${step.name}"></span>
                                <span class="badge bg-secondary ms-2"
                                      th:text="${step.parameters.size() + ' params'}"></span>
                                <span th:if="${!step.requiredQualifications.isEmpty()}"
                                      class="badge bg-warning text-dark ms-2">
                                    <i class="bi bi-award me-1"></i>
                                    <span th:text="${step.requiredQualifications.size()}"></span>
                                </span>
                            </button>
                        </h2>
                        <div th:id="'step-' + ${step.id}" class="accordion-collapse collapse"
                             data-bs-parent="#stepsAccordion">
                            <div class="accordion-body">
                                <p th:if="${step.description}" th:text="${step.description}"></p>

                                <!-- Required Qualifications -->
                                <div th:if="${!step.requiredQualifications.isEmpty()}" class="mb-3">
                                    <strong>Required Qualifications:</strong>
                                    <span th:each="q : ${step.requiredQualifications}"
                                          class="badge bg-warning text-dark me-1"
                                          th:text="${q.name}"></span>
                                </div>

                                <!-- Parameters -->
                                <h6>Parameters:</h6>
                                <table class="table table-sm" th:if="${!step.parameters.isEmpty()}">
                                    <thead>
                                        <tr>
                                            <th>Name</th>
                                            <th>Type</th>
                                            <th>Required</th>
                                            <th>Range</th>
                                            <th>Unit</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="p : ${step.parameters}">
                                            <td th:text="${p.name}"></td>
                                            <td><span class="badge bg-info" th:text="${p.parameterType}"></span></td>
                                            <td>
                                                <i th:if="${p.required}" class="bi bi-check-circle text-success"></i>
                                                <i th:unless="${p.required}" class="bi bi-dash text-muted"></i>
                                            </td>
                                            <td>
                                                <span th:if="${p.minValue != null || p.maxValue != null}">
                                                    <span th:text="${p.minValue}"></span> ~
                                                    <span th:text="${p.maxValue}"></span>
                                                </span>
                                            </td>
                                            <td th:text="${p.unit}"></td>
                                        </tr>
                                    </tbody>
                                </table>
                                <p th:if="${step.parameters.isEmpty()}" class="text-muted">No parameters defined</p>

                                <!-- Add Parameter Form (only for DRAFT) -->
                                <div th:if="${recipe.status.name() == 'DRAFT'}" class="mt-3 border-top pt-3"
                                     sec:authorize="hasRole('ADMIN')">
                                    <form th:action="@{/recipes/{rid}/steps/{sid}/parameters(rid=${recipe.id}, sid=${step.id})}"
                                          method="post" class="row g-2">
                                        <div class="col-md-2">
                                            <input type="text" class="form-control form-control-sm"
                                                   name="name" placeholder="Param name" required>
                                        </div>
                                        <div class="col-md-2">
                                            <select class="form-select form-select-sm" name="parameterType">
                                                <option th:each="pt : ${parameterTypes}"
                                                        th:value="${pt}" th:text="${pt}"></option>
                                            </select>
                                        </div>
                                        <div class="col-md-1">
                                            <input type="number" step="any" class="form-control form-control-sm"
                                                   name="minValue" placeholder="Min">
                                        </div>
                                        <div class="col-md-1">
                                            <input type="number" step="any" class="form-control form-control-sm"
                                                   name="maxValue" placeholder="Max">
                                        </div>
                                        <div class="col-md-1">
                                            <input type="text" class="form-control form-control-sm"
                                                   name="unit" placeholder="Unit">
                                        </div>
                                        <div class="col-md-1">
                                            <div class="form-check mt-1">
                                                <input type="checkbox" class="form-check-input"
                                                       name="required" checked>
                                                <label class="form-check-label">Req</label>
                                            </div>
                                        </div>
                                        <div class="col-md-2">
                                            <button type="submit" class="btn btn-sm btn-outline-primary">
                                                <i class="bi bi-plus"></i> Add
                                            </button>
                                        </div>
                                    </form>
                                </div>

                                <!-- Delete Step Button -->
                                <div th:if="${recipe.status.name() == 'DRAFT'}" class="mt-3 text-end"
                                     sec:authorize="hasRole('ADMIN')">
                                    <form th:action="@{/recipes/{rid}/steps/{sid}/delete(rid=${recipe.id}, sid=${step.id})}"
                                          method="post" class="d-inline">
                                        <button type="submit" class="btn btn-sm btn-outline-danger"
                                                onclick="return confirm('Delete this step?')">
                                            <i class="bi bi-trash me-1"></i>Delete Step
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-3">
            <a th:href="@{/recipes}" class="btn btn-secondary">
                <i class="bi bi-arrow-left me-1"></i>Back to List
            </a>
        </div>
    </div>
</th:block>
</body>
</html>
