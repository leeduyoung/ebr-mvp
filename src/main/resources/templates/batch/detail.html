<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<th:block th:replace="~{layout/default :: layout(~{::content})}">
    <div th:fragment="content">
        <!-- Alerts -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
            <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Batch Header -->
        <div class="d-flex justify-content-between align-items-start mb-4">
            <div>
                <h2>
                    <span th:text="${batch.batchNumber}"></span>
                    <span class="badge ms-2"
                          th:classappend="${batch.status.name() == 'CREATED'} ? 'bg-secondary' :
                                          (${batch.status.name() == 'RELEASED'} ? 'bg-primary' :
                                          (${batch.status.name() == 'IN_PROGRESS'} ? 'bg-warning text-dark' :
                                          (${batch.status.name() == 'COMPLETED'} ? 'bg-success' : 'bg-danger')))"
                          th:text="${batch.status}"></span>
                </h2>
                <p class="text-muted mb-0">
                    Recipe: <a th:href="@{/recipes/{id}(id=${batch.recipe.id})}"
                              th:text="${batch.recipe.code + ' - ' + batch.recipe.name}"></a>
                </p>
            </div>
            <div class="btn-group" sec:authorize="hasAnyRole('ADMIN', 'SUPERVISOR')">
                <form th:if="${batch.status.name() == 'CREATED'}"
                      th:action="@{/batches/{id}/release(id=${batch.id})}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-primary"
                            onclick="return confirm('Release this batch for production?')">
                        <i class="bi bi-check-circle me-1"></i>Release
                    </button>
                </form>
                <form th:if="${batch.status.name() != 'COMPLETED' && batch.status.name() != 'CANCELLED'}"
                      th:action="@{/batches/{id}/cancel(id=${batch.id})}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-danger"
                            onclick="return confirm('Cancel this batch?')">
                        <i class="bi bi-x-circle me-1"></i>Cancel
                    </button>
                </form>
            </div>
        </div>

        <!-- Batch Info -->
        <div class="row mb-4">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <p><strong>Planned Quantity:</strong>
                                    <span th:if="${batch.plannedQuantity != null}">
                                        <span th:text="${batch.plannedQuantity}"></span>
                                        <span th:text="${batch.quantityUnit}"></span>
                                    </span>
                                    <span th:unless="${batch.plannedQuantity != null}" class="text-muted">-</span>
                                </p>
                                <p><strong>Created:</strong>
                                    <span th:text="${#temporals.format(batch.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
                                </p>
                                <p th:if="${batch.createdBy}"><strong>Created By:</strong>
                                    <span th:text="${batch.createdBy.name}"></span>
                                </p>
                            </div>
                            <div class="col-md-6">
                                <p th:if="${batch.releasedAt}"><strong>Released:</strong>
                                    <span th:text="${#temporals.format(batch.releasedAt, 'yyyy-MM-dd HH:mm')}"></span>
                                </p>
                                <p th:if="${batch.startedAt}"><strong>Started:</strong>
                                    <span th:text="${#temporals.format(batch.startedAt, 'yyyy-MM-dd HH:mm')}"></span>
                                </p>
                                <p th:if="${batch.completedAt}"><strong>Completed:</strong>
                                    <span th:text="${#temporals.format(batch.completedAt, 'yyyy-MM-dd HH:mm')}"></span>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body text-center">
                        <h6>Progress</h6>
                        <div class="display-4" th:text="${batch.completedStepCount + '/' + batch.totalStepCount}"></div>
                        <div class="progress mt-2" style="height: 10px;">
                            <div class="progress-bar bg-success"
                                 th:style="'width: ' + ${batch.progressPercentage} + '%'">
                            </div>
                        </div>
                        <small class="text-muted" th:text="${#numbers.formatDecimal(batch.progressPercentage, 1, 1) + '%'}"></small>
                    </div>
                </div>
            </div>
        </div>

        <!-- Steps Timeline -->
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0"><i class="bi bi-list-check me-2"></i>Execution Steps</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th style="width: 80px;">Step</th>
                                <th>Name</th>
                                <th>Status</th>
                                <th>Operator</th>
                                <th>Started</th>
                                <th>Completed</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="step : ${batch.steps}">
                                <td>
                                    <span class="badge bg-dark" th:text="${step.stepNumber}"></span>
                                </td>
                                <td th:text="${step.recipeStep.name}"></td>
                                <td>
                                    <span class="badge"
                                          th:classappend="${step.status.name() == 'PENDING'} ? 'bg-secondary' :
                                                          (${step.status.name() == 'IN_PROGRESS'} ? 'bg-warning text-dark' :
                                                          (${step.status.name() == 'COMPLETED'} ? 'bg-success' : 'bg-info'))"
                                          th:text="${step.status}"></span>
                                </td>
                                <td>
                                    <span th:if="${step.operator}" th:text="${step.operator.name}"></span>
                                    <span th:unless="${step.operator}" class="text-muted">-</span>
                                </td>
                                <td>
                                    <span th:if="${step.startedAt}"
                                          th:text="${#temporals.format(step.startedAt, 'HH:mm:ss')}"></span>
                                    <span th:unless="${step.startedAt}" class="text-muted">-</span>
                                </td>
                                <td>
                                    <span th:if="${step.completedAt}"
                                          th:text="${#temporals.format(step.completedAt, 'HH:mm:ss')}"></span>
                                    <span th:unless="${step.completedAt}" class="text-muted">-</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Execute Button for Operators -->
                <div th:if="${batch.status.name() == 'RELEASED' || batch.status.name() == 'IN_PROGRESS'}"
                     class="text-center mt-3" sec:authorize="hasRole('OPERATOR')">
                    <a th:href="@{/execution/{id}(id=${batch.id})}" class="btn btn-success btn-lg">
                        <i class="bi bi-play-circle me-2"></i>Execute Batch
                    </a>
                </div>
            </div>
        </div>

        <div class="mt-3">
            <a th:href="@{/batches}" class="btn btn-secondary">
                <i class="bi bi-arrow-left me-1"></i>Back to List
            </a>
        </div>
    </div>
</th:block>
</body>
</html>
