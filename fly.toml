# fly.toml app configuration file generated for ebr-mvp-opus on 2025-12-23T17:52:10+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ebr-mvp-opus'
primary_region = 'nrt'  # Tokyo - closer to Seoul (Supabase)

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
