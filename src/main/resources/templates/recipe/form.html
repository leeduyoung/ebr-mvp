<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:replace="~{layout/default :: layout(~{::content})}">
    <div th:fragment="content">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="bi bi-journal-plus me-2"></i>
                            <span th:if="${recipe == null}">Create New Recipe</span>
                            <span th:if="${recipe != null}">Edit Recipe</span>
                        </h5>
                    </div>
                    <div class="card-body">
                        <div th:if="${errorMessage}" class="alert alert-danger">
                            <span th:text="${errorMessage}"></span>
                        </div>

                        <form th:action="${recipe == null} ? @{/recipes} : @{/recipes/{id}(id=${recipe.id})}"
                              method="post">
                            <div class="mb-3">
                                <label for="code" class="form-label">Recipe Code *</label>
                                <input type="text" class="form-control" id="code" name="code"
                                       th:value="${recipe?.code}"
                                       th:readonly="${recipe != null}"
                                       placeholder="e.g., RCP-001" required>
                                <div class="form-text">Unique identifier for the recipe</div>
                            </div>

                            <div class="mb-3">
                                <label for="name" class="form-label">Recipe Name *</label>
                                <input type="text" class="form-control" id="name" name="name"
                                       th:value="${recipe?.name}"
                                       placeholder="e.g., Tablet Production Recipe" required>
                            </div>

                            <div class="mb-3">
                                <label for="description" class="form-label">Description</label>
                                <textarea class="form-control" id="description" name="description"
                                          rows="3" th:text="${recipe?.description}"
                                          placeholder="Recipe description..."></textarea>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-check-lg me-1"></i>
                                    <span th:if="${recipe == null}">Create Recipe</span>
                                    <span th:if="${recipe != null}">Update Recipe</span>
                                </button>
                                <a th:href="${recipe == null} ? @{/recipes} : @{/recipes/{id}(id=${recipe.id})}"
                                   class="btn btn-secondary">
                                    Cancel
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
