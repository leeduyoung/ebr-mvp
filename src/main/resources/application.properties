spring.application.name=ebr

# Server
server.port=${PORT:8080}
server.error.include-stacktrace=never

# Database (환경 변수 지원, 기본값은 로컬 개발용)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/ebr_db}
spring.datasource.username=${DB_USERNAME:ebr_user}
spring.datasource.password=${DB_PASSWORD:ebr_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Thymeleaf
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# Session
server.servlet.session.timeout=30m
